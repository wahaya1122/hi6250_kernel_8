name: (GCC)Kernel Builder Huawei nova2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v2
      with:
        repository: wahaya1122/hi6250_kernel_8
        path: thisRepo

    - name: Building
      run: |

        sudo apt update && sudo apt upgrade
        sudo apt install -y git-core gnupg flex bison gperf build-essential zip curl \
          zlib1g-dev libc6-dev-i386 libx11-dev lib32z-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip bc gzip \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

        mv thisRepo/* .
        rm -rf thisRepo
        sudo cp ./res/libdebuginfod.so.1 /usr/lib
        sudo chmod 777 /usr/lib/libdebuginfod.so.1

        mv kernel source
        cd source
        cd ..

        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        cd source
        make merge_hi6250_defconfig
        make -j$(nproc)

        cd arch/arm64/boot
        mv Image kernel-Image
        gzip kernel-Image

        wget https://github.com/CoolestEnoch/kernel-su-huawei-nova2/releases/download/20230216-ksu16/nova2-ksu.zip
        unzip nova2-ksu.zip -d ./anykernel
        rm anykernel/kernel-Image.gz
        cp ./kernel-Image.gz anykernel/kernel-Image.gz
        cd anykernel
        zip nova2ksu.zip ./*

        echo ""
        echo "=== Building kernel modules ==="
        cd ${GITHUB_WORKSPACE}/source
        make -j$(nproc) modules
        echo ""
        echo "=== Collecting module files ==="
        mkdir -p modules_out
        find . -name "*.ko" -not -path "./modules_out/*" | while read ko; do
          echo "Found: $ko"
          cp "$ko" modules_out/
        done
        ls -la modules_out/

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: unzip-me-then-flash-this.zip
        path: ${{ github.workspace }}/source/arch/arm64/boot/anykernel/nova2ksu.zip

    - name: Upload Kernel Modules
      uses: actions/upload-artifact@v4
      with:
        name: kernel-modules
        path: ${{ github.workspace }}/source/modules_out/
